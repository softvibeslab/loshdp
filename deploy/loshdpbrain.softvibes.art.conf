# /etc/nginx/sites-available/loshdpbrain.softvibes.art — El Cerebro del Pueblo (cerebro 3D + recorrido de insights)
# Sirve la misma carpeta que publica deploy/publicar-cerebro.sh. Privado: misma contraseña que /mediahub/.
server {
    server_name loshdpbrain.softvibes.art;
    root /srv/loshdp-mediahub/cerebro;
    index index.html;
    charset utf-8;

    auth_basic "El Cerebro del Pueblo";
    auth_basic_user_file /etc/nginx/.htpasswd-loshdp-mediahub;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }
    location = /robots.txt {
        auth_basic off;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/loshdpbrain.softvibes.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loshdpbrain.softvibes.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = loshdpbrain.softvibes.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name loshdpbrain.softvibes.art;

    listen 80;
    return 404; # managed by Certbot


}