# /etc/nginx/sites-available/loshdp.softvibes.art — sitio estático de Los HDP (demo Softvibes)
server {
    server_name loshdp.softvibes.art;
    root /var/www/loshdp;
    include snippets/loshdp-mediahub.conf;
    index index.html;

    # Demo: no indexar hasta que el cliente apruebe y tenga dominio propio
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    # Calendarios de transmisiones en vivo (agendar y suscripción webcal)
    location ~ \.ics$ {
        types { }
        default_type text/calendar;
        charset utf-8;
        charset_types text/calendar;
    }
    location = /robots.txt {
        return 200 "User-agent: *\nDisallow: /\n";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/loshdp.softvibes.art/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/loshdp.softvibes.art/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = loshdp.softvibes.art) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name loshdp.softvibes.art;

    listen 80;
    return 404; # managed by Certbot


}