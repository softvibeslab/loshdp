# /etc/nginx/snippets/loshdp-mediahub.conf — visor privado del mediahub (incluido en el vhost loshdp.softvibes.art)
location /mediahub/ {
    auth_basic "Mediahub Los HDP";
    auth_basic_user_file /etc/nginx/.htpasswd-loshdp-mediahub;
    alias /srv/loshdp-mediahub/web/;
    index index.html;
    charset utf-8;
    types { text/html html; application/javascript js; image/jpeg jpg; text/plain md; }
    charset_types text/plain application/javascript text/html;
}
# Solo se exponen las carpetas de media (no el venv, logs ni scripts)
location /mediahub/media/youtube/ {
    auth_basic "Mediahub Los HDP";
    auth_basic_user_file /etc/nginx/.htpasswd-loshdp-mediahub;
    alias /srv/loshdp-mediahub/youtube/;
    types { audio/ogg opus; video/mp4 mp4; audio/mp4 m4a; video/webm webm; }
}
location /mediahub/media/tiktok/ {
    auth_basic "Mediahub Los HDP";
    auth_basic_user_file /etc/nginx/.htpasswd-loshdp-mediahub;
    alias /srv/loshdp-mediahub/tiktok/;
    types { video/mp4 mp4; image/jpeg jpg; application/json json; }
}
# El Cerebro del Pueblo (cerebro 3D + recorrido de insights), misma contraseña que el mediahub
location /cerebro/ {
    auth_basic "Mediahub Los HDP";
    auth_basic_user_file /etc/nginx/.htpasswd-loshdp-mediahub;
    alias /srv/loshdp-mediahub/cerebro/;
    index index.html;
    charset utf-8;
    types { text/html html; application/javascript js; text/css css; application/json json; text/plain txt; }
    charset_types text/plain application/javascript text/html text/css application/json;
}
